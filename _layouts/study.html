<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} · juhan0</title>
<meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<style>
*{box-sizing:border-box}html{background:#fff;color:#222;color-scheme:light}body{max-width:720px;margin:0 auto;padding:40px 24px;font:16px/1.85 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow-wrap:anywhere}a{color:inherit;text-underline-offset:4px}a:hover{color:#555}a:focus-visible{outline:2px solid #333;outline-offset:4px}header.site{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #ddd;padding-bottom:18px;margin-bottom:40px}.brand{font-weight:650;text-decoration:none}nav{display:flex;gap:18px;font-size:14px}h1{font-size:28px;line-height:1.4;margin:0 0 12px;letter-spacing:-.04em}h2{font-size:22px;margin:36px 0 12px}h3{font-size:18px}.muted,time{color:#777;font-size:14px}.intro{color:#666;margin:0 0 32px}.posts{list-style:none;padding:0;margin:0}.posts li{padding:18px 0;border-bottom:1px solid #eee}.posts a{display:block;font-size:18px;text-decoration:none;margin-bottom:3px}.posts a:hover{text-decoration:underline}.posts p{margin:6px 0 0;color:#666;font-size:14px}.meta{margin-bottom:32px}.prose img{max-width:100%;height:auto}.prose pre{padding:16px;background:#f6f6f6;overflow:auto;line-height:1.6}.prose code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#f6f6f6;padding:2px 4px}.prose pre code{padding:0;white-space:pre}.prose blockquote{margin:24px 0;padding-left:18px;border-left:2px solid #ccc;color:#666}.prose table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}.prose th,.prose td{border:1px solid #ddd;padding:8px 12px}.prose hr{border:0;border-top:1px solid #ddd;margin:32px 0}details{font-size:14px;margin:24px 0;color:#666}details ul{padding-left:20px}.post-nav{margin-top:48px;border-top:1px solid #ddd;padding-top:20px}footer{margin-top:64px;color:#888;font-size:12px}.skip{position:absolute;top:-100px}.skip:focus{top:8px;background:white}@media(max-width:480px){body{padding:24px 20px}header.site{margin-bottom:32px}h1{font-size:25px}nav{gap:12px}}
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<header class="site"><a class="brand" href="{{ '/' | relative_url }}">juhan0의 기록</a><nav aria-label="메뉴"><a href="{{ '/' | relative_url }}">글 목록</a><a href="https://github.com/juhan0/portfolio/new/main/_posts">글 쓰기</a></nav></header>
<main id="main">
<h1>{{ page.title | escape }}</h1>
{% if page.kind == 'post' %}
<p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>{% for category in page.categories %} · {{ category | escape }}{% endfor %}</p>
<article class="prose">{{ content }}</article>
<div class="post-nav"><a href="{{ '/' | relative_url }}">← 글 목록으로</a></div>
{% else %}
{{ content }}
{% endif %}
</main>
<footer>juhan0 · <a href="https://github.com/juhan0">GitHub</a></footer>
</body>
</html>
